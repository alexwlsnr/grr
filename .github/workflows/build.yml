name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    # Runs the real app.js in a VM with a stubbed DOM (test/), plus the
    # standalone simulations. A failure here blocks every build.
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check src/frontend/app.js

      - name: Unit tests (real app.js)
        run: node --test test/app.test.mjs

      - name: Simulation tests
        run: |
          node test-herd.mjs
          node test-lives.mjs

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK (the tinyjs installer checks for it)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0

      - name: Install tinyjs
        run: |
          curl -fsSL https://tinyjs.app/install | sh
          # The installer symlinks into ~/.local/bin (already on the runner
          # PATH); fall back to the tool dir if a future installer changes.
          if ! command -v tinyjs >/dev/null; then
            for d in "$HOME/.local/bin" "$HOME/.tinyjs/bin" "$HOME/.tinyjs"; do
              if [ -e "$d/tinyjs" ]; then
                echo "PATH=$d:$PATH" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          tinyjs version

      - name: Build
        run: tinyjs build

      - name: Package
        run: |
          # A portable folder: the compiled backend + the native launcher.
          mkdir grr
          cp dist/minesweeper dist/launcher grr/
          tar --owner=0 --group=0 -czf grr-linux-x86_64.tar.gz grr

      - uses: actions/upload-artifact@v4
        with:
          name: grr-linux-x86_64
          path: grr-linux-x86_64.tar.gz

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install tinyjs and build
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          # The installer updates the user PATH, which this session can't
          # see — add the tool dir directly.
          $env:Path += ";$(Join-Path $env:LOCALAPPDATA 'tinyjs')"
          tinyjs version
          tinyjs build

      - name: Package
        shell: pwsh
        run: |
          # Portable folder: minesweeper.exe (frontend rides inside its TPK
          # bundle) + launcher.exe.
          Rename-Item dist grr
          Compress-Archive -Path grr -DestinationPath grr-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: grr-windows-x86_64
          path: grr-windows-x86_64.zip

  release:
    # Pushes to main (or a v* tag) refresh the single "latest" release with
    # both binaries. Pushes to any other branch refresh that branch's
    # prerelease "pre-<branch>", which never touches "latest". PR builds get
    # artifacts only. One job owns all releases, and the concurrency group
    # serialises them so delete + recreate can't race.
    name: Refresh release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4  # gh needs a repo to resolve the remote + tag

      - uses: actions/download-artifact@v4
        with:
          name: grr-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: grr-windows-x86_64

      - name: Replace the release for this push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          ASSETS="grr-linux-x86_64.tar.gz grr-windows-x86_64.zip"
          BODY="grr — retro Windows Minesweeper in a ~10 MB native tinyjs window (no Electron).

          - **grr-linux-x86_64.tar.gz** — extract, run \`./grr/minesweeper\` (needs libwebkit2gtk-4.1)
          - **grr-windows-x86_64.zip** — extract, run \`grr\\minesweeper.exe\` (needs the WebView2 runtime)

          Built from ${GITHUB_SHA:0:7} (${REF#refs/heads/})."

          if [ "$REF" = "refs/heads/main" ] || [[ "$REF" == refs/tags/v* ]]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest $ASSETS --title "Latest" --notes "$BODY"
          else
            # Branch push: one prerelease per branch. Slashes are not allowed
            # in the tag, so they become dashes.
            TAG="pre-$(echo "${REF#refs/heads/}" | tr '/' '-')"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" $ASSETS --prerelease --target "$GITHUB_SHA" \
              --title "Prerelease: ${REF#refs/heads/}" --notes "$BODY"
          fi
